name: 生成每日深度长文

on:
  schedule:
    - cron: '0 0 * * *' # 每天北京时间早上 8:00
  workflow_dispatch: # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 允许机器人写入文件

    steps:
    - name: 检查仓库代码
      uses: actions/checkout@v3

    - name: 设置 Python 环境
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 安装依赖库
      run: |
        pip install -r requirements.txt

    - name: 运行AI深度加工脚本
      env:
        DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }} # 注入你的DeepSeek Key
      run: python generate_deep.py

    - name: 将生成的简报提交回仓库
      run: |
        git config --local user.email "bot@github.com"
        git config --local user.name "bot"
        git add briefs/
        git commit -m "更新深度长文 $(date +'%Y-%m-%d')" || exit 0
        git push
